# DataCite REST API (public, unauthenticated reads)
datacite.api.base-url=https://api.datacite.org
# Optional: restrict /datacite/products and /datacite/grants results to one DataCite DOI prefix (e.g. an
# organisation's own prefix). Blank (default) means no restriction - results span all of
# DataCite.
datacite.prefix=
# Default DataCite REST client timeouts
quarkus.rest-client."org.skgif.doi.datacite.DataCiteClient".url=${datacite.api.base-url}
quarkus.rest-client."org.skgif.doi.datacite.DataCiteClient".connect-timeout=5000
quarkus.rest-client."org.skgif.doi.datacite.DataCiteClient".read-timeout=10000

# Crossref REST API (public, unauthenticated reads). Served at /crossref/products and
# /crossref/grants - provider selection is by URL path, not auto-detected.
crossref.api.base-url=https://api.crossref.org
# Optional: restrict /crossref/products and /crossref/grants list results to one DOI prefix,
# same convention as datacite.prefix.
crossref.prefix=
quarkus.rest-client."org.skgif.doi.crossref.CrossrefClient".url=${crossref.api.base-url}
quarkus.rest-client."org.skgif.doi.crossref.CrossrefClient".connect-timeout=5000
quarkus.rest-client."org.skgif.doi.crossref.CrossrefClient".read-timeout=10000
# Optional: identifies this API to Crossref's "polite pool" for better rate limits/uptime.
crossref.mailto=
# XML "transform" endpoint (application/vnd.crossref.unixsd+xml), fetched only for
# chapter-in-a-book/paper-in-proceedings records (see CrossrefTypeMapping#isXmlVenueEnrichable)
# to build an accurate Venue - see CrossrefXmlTransformClient/CrossrefVenueMetadataXmlParser.
quarkus.rest-client."org.skgif.doi.crossref.CrossrefXmlTransformClient".url=${crossref.api.base-url}
quarkus.rest-client."org.skgif.doi.crossref.CrossrefXmlTransformClient".connect-timeout=5000
quarkus.rest-client."org.skgif.doi.crossref.CrossrefXmlTransformClient".read-timeout=10000

# mEDRA metadata API (public, unauthenticated reads; ONIX-for-DOI 2.0 XML). Served at
# /medra/products only - no /medra/grants (ONIX-for-DOI has no funding/grant concept - see
# SKG_IF_DOI_MAPPING_LIMITATIONS.md) and no list/search endpoint (the API only supports
# metadata-by-DOI lookup, no facet/browse capability - see MedraClient).
medra.api.base-url=https://api.medra.org
quarkus.rest-client."org.skgif.doi.medra.MedraClient".url=${medra.api.base-url}
quarkus.rest-client."org.skgif.doi.medra.MedraClient".connect-timeout=5000
quarkus.rest-client."org.skgif.doi.medra.MedraClient".read-timeout=10000

# SKG-IF local_identifier: DOI-based (Option 2 in https://skg-if.github.io/api/) - every
# record served by this API has a permanent DataCite DOI, so the DOI itself (as a doi.org
# URL) is used as local_identifier. See plan doc for the full rationale.
skgif.local-identifier.base-url=https://doi.org/
# Declared JSON-LD @context @base, namespaced per-response to the DataCite client that
# registered the served DOI(s) (relationships.client.data.id, e.g. "inist.esrf") -
# <skgif.sandbox.base-url><client id>/. On-the-fly identifiers minted for entities without
# a stable id of their own (see MapperTextUtils#otf) resolve against this.
skgif.sandbox.base-url=https://w3id.org/skg-if/sandbox/
# Fallback @base used only when a DOI's DataCite data carries no client relationship.
skgif.context.base=https://w3id.org/skg-if/sandbox/esrf/

# Default page size for the /datacite/products, /datacite/grants, /crossref/products, and
# /crossref/grants list endpoints
skgif.default-page-size=20

# Omit unset optional SKG-IF fields (e.g. contributions[].by.entity_type - see
# DataCiteToSkgIfMapper's javadoc) whether the mapper leaves them null or returns an empty
# List/Map - mappers return empty collections rather than null (see PMD's
# ReturnEmptyCollectionRatherThanNull rule in pmd-ruleset.xml), so non-empty is required here
# instead of non-null to still omit them from output.
quarkus.jackson.serialization-inclusion=non-empty

# Trust X-Forwarded-Proto/X-Forwarded-Host from a fronting reverse proxy (GitHub Codespaces
# port forwarding, the OKD route in DEPLOYMENT_EOSC_NODE.md) when reconstructing absolute URLs
# (local_identifier, etc. in JsonLdResponses#baseUri) - otherwise they reflect the internal
# request the proxy made (e.g. http://localhost:8080) instead of the public-facing URL.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true

# Dev UI (/q/dev-ui) has its own separate host check (LocalHostOnlyFilter) that rejects any
# Host header other than localhost/127.0.0.1, to guard against DNS-rebinding attacks against
# the dev-mode debug console. Codespaces forwards a random *.app.github.dev hostname per
# session, so allow that whole domain (regex) rather than one hardcoded name.
%dev.quarkus.dev-ui.hosts=^.*\\.app\\.github\\.dev$

# Make Swagger UI available in the packaged prod build too, not just dev/test mode - this
# API runs as a real server (see DEPLOYMENT_EOSC_NODE.md), and RootResource redirects "/" to it.
quarkus.swagger-ui.always-include=true

# Quarkus binds quarkus.http.host to localhost in dev/test mode by default (only 0.0.0.0
# in prod - see JAVA_OPTS_APPEND in src/main/docker/Dockerfile.jvm). Override for dev so
# quarkus:dev is reachable through a container's external interface (e.g. GitHub
# Codespaces port forwarding).
%dev.quarkus.http.host=0.0.0.0

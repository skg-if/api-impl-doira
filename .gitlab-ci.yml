stages:
  - build
  - validate
  #- image

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

build:
  stage: build
  tags:
    - linux
  image: maven:3.9-eclipse-temurin-21
  script:
    - |
      if echo "$CI_COMMIT_MESSAGE" | grep -qiE 'notests?|skiptests?'; then
        echo "Commit message requests skipping tests - skipping unit tests"
        mvn -B package -DskipTests
      else
        mvn -B package
      fi
  cache:
    key: "$CI_COMMIT_REF_SLUG-m2"
    paths:
      - .m2/repository
  artifacts:
    paths:
      - target/quarkus-app/
    expire_in: 1 hour

validate-live-api:
  stage: validate
  tags:
    - linux
  image: maven:3.9-eclipse-temurin-21
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /notests?|skiptests?/i'
      when: never
    - when: on_success
  variables:
    # Free-text filter applied to the initial /products (resp. /grants) list search on both
    # providers (DataCite + Crossref share the `cf.search.title` filter key - see
    # ProductFilters/GrantFilters/CrossrefFilters). Override per-pipeline without editing the
    # script, e.g. via CI/CD > Variables.
    CONTRACT_TEST_FILTER_PRODUCTS: "cf.search.title:tomography"
    CONTRACT_TEST_FILTER_GRANTS: "cf.search.title:research"
  script:
    - bash scripts/ci/validate-live-endpoints.sh


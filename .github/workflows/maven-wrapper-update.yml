# Bumps the Maven wrapper. There is no Dependabot ecosystem for maven-wrapper.properties (only
# Renovate has that manager), so this fills the one gap in .github/dependabot.yml.
#
# Safe to automate because the Maven version now lives only in
# .mvn/wrapper/maven-wrapper.properties, mvnw and mvnw.cmd - all three rewritten by
# `wrapper:wrapper` in a single command - plus .claude/skills/ISSUES.md, a historical log
# explicitly exempted by ToolchainVersionConsistencyTest. Do not let the version get pasted back
# into the skills: that test fails the build if it does, and before it was centralised a green
# wrapper bump would have left every agent in the repo unable to find mvn.
#
# Stays on the 3.9.x line: Maven 4 is a migration, not a bump.
name: Maven wrapper update

on:
  schedule:
    - cron: '0 5 1 * *' # monthly, 1st at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump-wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-from-pom

      - name: Bump wrapper to the latest Maven 3.9.x
        id: bump
        run: |
          set -euo pipefail
          current=$(sed -nE 's#.*apache-maven-(3\.9\.[0-9]+)-bin\.zip.*#\1#p' \
            .mvn/wrapper/maven-wrapper.properties)
          latest=$(curl -sSf \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/maven-metadata.xml \
            | grep -oE '<version>3\.9\.[0-9]+</version>' | tail -1 | sed 's#</\?version>##g')
          echo "current=$current latest=$latest"
          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "::error::could not determine current ($current) or latest ($latest) Maven version"
            exit 1
          fi
          if [ "$current" = "$latest" ]; then
            echo "up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x ./mvnw
          # Rewrites maven-wrapper.properties, mvnw and mvnw.cmd together.
          ./mvnw -B -N wrapper:wrapper -Dmaven="$latest" -Dtype=only-script
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/maven-wrapper
          title: "build: bump Maven wrapper to ${{ steps.bump.outputs.latest }}"
          labels: dependencies
          commit-message: "build: bump Maven wrapper to ${{ steps.bump.outputs.latest }}"
          body: |
            Regenerated by `./mvnw wrapper:wrapper`. Touches
            `.mvn/wrapper/maven-wrapper.properties`, `mvnw` and `mvnw.cmd`.

            `.claude/skills/ISSUES.md` still quotes the old version on purpose (historical log,
            exempted by `ToolchainVersionConsistencyTest`) - leave it alone.

            Note: opened with the default `GITHUB_TOKEN`, which cannot trigger other workflows,
            so this PR's own CI does not start automatically. Close and reopen it to kick CI.

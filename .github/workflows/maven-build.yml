name: Maven Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.skip_check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine skip-tests flag
        id: skip_check
        run: |
          message=$(git log -1 --pretty=%B)
          if echo "$message" | grep -qiE 'notests?|skiptests?'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          if [ "${{ steps.skip_check.outputs.skip }}" = "true" ]; then
            ./mvnw -B package -DskipTests
          else
            ./mvnw -B package
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: quarkus-app
          path: target/quarkus-app/
          retention-days: 1

  validate-live-api:
    needs: build
    if: needs.build.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    env:
      CONTRACT_TEST_FILTER_PRODUCTS: "cf.search.title:tomography"
      CONTRACT_TEST_FILTER_GRANTS: "cf.search.title:research"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v8
        with:
          name: quarkus-app
          path: target/quarkus-app

      - name: Validate live DataCite/Crossref endpoints
        run: bash scripts/ci/validate-live-endpoints.sh

  docker-publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: quarkus-app
          path: target/quarkus-app

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

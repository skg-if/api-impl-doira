name: Maven Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# Least-privilege default for every job. docker-publish declares its own job-level
# `permissions:` (contents: read, packages: write), which overrides this.
permissions:
  contents: read

# Dependency-bot PRs and quick follow-up pushes otherwise stack full pipeline runs -
# including validate-live-api, which makes real DataCite/Crossref calls. Cancel superseded
# PR runs; never cancel a push/tag run, since docker-publish publishes from those.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.skip_check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-from-pom
        with:
          cache: maven

      - name: Determine skip-tests flag
        id: skip_check
        run: |
          message=$(git log -1 --pretty=%B)
          if echo "$message" | grep -qiE 'notests?|skiptests?'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          if [ "${{ steps.skip_check.outputs.skip }}" = "true" ]; then
            ./mvnw -B package -DskipTests
          else
            ./mvnw -B package
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: quarkus-app
          path: target/quarkus-app/
          retention-days: 1

  validate-live-api:
    needs: build
    # Skipped for non-Maven dependency-bot branches (github_actions, docker): those cannot change
    # mapper output, and this job makes real outbound calls to api.datacite.org /
    # api.crossref.org. Kept for dependabot/maven/* - a Quarkus platform bump is exactly the
    # change where a live contract test earns its keep, since a Jackson/RESTEasy behaviour change
    # inside the platform is what would silently alter the JSON-LD shape. github.head_ref is
    # empty on push/tag events, so startsWith(...) is false there and this reduces to the
    # skip_tests check.
    if: >-
      needs.build.outputs.skip_tests != 'true' &&
      (!startsWith(github.head_ref, 'dependabot/') ||
       startsWith(github.head_ref, 'dependabot/maven'))
    runs-on: ubuntu-latest
    env:
      CONTRACT_TEST_FILTER_PRODUCTS: "cf.search.title:tomography"
      CONTRACT_TEST_FILTER_GRANTS: "cf.search.title:research"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-java-from-pom

      - uses: actions/download-artifact@v8
        with:
          name: quarkus-app
          path: target/quarkus-app

      - name: Validate live DataCite/Crossref endpoints
        run: bash scripts/ci/validate-live-endpoints.sh

  docker-publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: quarkus-app
          path: target/quarkus-app

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
